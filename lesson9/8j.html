<!DOCTYPE html>
<html>
<head>
  <title>Exercise 8j</title>
</head>
<body>

<script>
  const score = {
    wins: 0,
    losses: 0
  };

  console.log(score);

  function playGame(result) {
    if (result === 'win') {
      score.wins++;
    } else {
      score.losses++;
    }

    console.log(score);
  }

  playGame('win');
  playGame('loss');
</script>

</body>
</html>
